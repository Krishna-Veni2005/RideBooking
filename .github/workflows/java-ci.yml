name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java code
        run: javac src/RideBooking.java
      - name: Run RideBooking program
        run: java -cp src RideBooking
      - name: Run automated tests
        run: |
          javac src/RideBooking.java src/RideBookingTest.java
          java -cp src RideBookingTest
      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: ridebooking-build
          path: src/*.class
