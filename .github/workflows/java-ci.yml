name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java code
        run: javac src/RideBooking.java
      - name: Run RideBooking program
        run: java -cp src RideBooking
      - name: Run automated tests
        run: |
          javac src/RideBooking.java src/RideBookingTest.java
          java -cp src RideBookingTest
      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: ridebooking-build
          path: src/*.class
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: ridebooking-build
          path: deployed

      - name: Verify deployment files
        run: |
          echo "Deploying RideBooking..."
          echo "Environment message: ${{ secrets.STAGING_MESSAGE }}"
          ls -la deployed
  production:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: ridebooking-build
          path: production

      - name: Deploy to production
        run: |
          echo "Deploying RideBooking to production..."
          ls -la production